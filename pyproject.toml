[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-watchdog"
version = "0.1.0"
description = "Windows-native ClaudeCode watchdog for silent interruptions and empty responses."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Super-YYQ"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ccs-watchdog = "ccs_watchdog.cli.main:main"
ccw = "ccs_watchdog.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
